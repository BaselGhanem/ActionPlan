name: Deploy ActionPlan to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run test:firebase
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - run: npm run test:sites
      - run: cp dist/client/index.html dist/client/admin.html
      - name: Validate compiled GitHub Pages output
        run: |
          test -s dist/client/index.html
          test -s dist/client/assets/exceljs.min.js
          grep -q '/ActionPlan/assets/index-' dist/client/index.html
          if grep -qE '%BASE_URL%|/src/main.jsx' dist/client/index.html; then
            echo 'ERROR: GitHub Pages entrypoint contains Vite development paths'
            exit 1
          fi
      - name: Publish compiled site to branch root
        run: |
          cp dist/client/index.html index.html
          cp dist/client/admin.html admin.html
          mkdir -p assets
          cp -a dist/client/assets/. assets/
          cp dist/client/favicon.ico favicon.ico
          cp dist/client/setup.html setup.html
          cp dist/client/firestore.rules.txt firestore.rules.txt
          touch .nojekyll
          git add -- index.html admin.html assets favicon.ico setup.html firestore.rules.txt .nojekyll
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Publish compiled ActionPlan assets [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
